# Control plane only (ADR-005). CrispASR and the worker run natively on the host.
name: aerochorus

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aerochorus
      POSTGRES_PASSWORD: aerochorus
      POSTGRES_DB: aerochorus
    ports:
      - "127.0.0.1:${AEROCHORUS_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerochorus -d aerochorus"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["aerochorus", "db", "upgrade"]
    environment:
      AEROCHORUS_DATABASE_URL: postgresql+psycopg://aerochorus:aerochorus@postgres:5432/aerochorus
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["aerochorus", "api", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      AEROCHORUS_DATABASE_URL: postgresql+psycopg://aerochorus:aerochorus@postgres:5432/aerochorus
    ports:
      - "127.0.0.1:${AEROCHORUS_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
