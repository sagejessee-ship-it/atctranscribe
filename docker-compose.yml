# Development control plane on this PC (Windows / 5080). The worker, CrispASR and the
# review edge run natively here. The Linux host runs everything in containers from
# deploy/linux/compose.yml instead (ADR-023).
name: aerochorus

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aerochorus
      POSTGRES_PASSWORD: aerochorus
      POSTGRES_DB: aerochorus
    ports:
      - "127.0.0.1:${AEROCHORUS_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during first initialisation the temporary server listens on the Unix
      # socket only, so a socket check would pass before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aerochorus -d aerochorus"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: { context: ., target: app }
    command: ["aerochorus", "db", "upgrade"]
    environment:
      AEROCHORUS_DATABASE_URL: postgresql+psycopg://aerochorus:aerochorus@postgres:5432/aerochorus
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: { context: ., target: app }
    command: ["aerochorus", "api", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      AEROCHORUS_DATABASE_URL: postgresql+psycopg://aerochorus:aerochorus@postgres:5432/aerochorus
      # Optional on-demand ADS-B context (ADR-020): put these in ./.env (gitignored).
      AEROCHORUS_OPENSKY_USERNAME: ${AEROCHORUS_OPENSKY_USERNAME:-}
      AEROCHORUS_OPENSKY_PASSWORD: ${AEROCHORUS_OPENSKY_PASSWORD:-}
      AEROCHORUS_OPENSKY_CLIENT_ID: ${AEROCHORUS_OPENSKY_CLIENT_ID:-}
      AEROCHORUS_OPENSKY_CLIENT_SECRET: ${AEROCHORUS_OPENSKY_CLIENT_SECRET:-}
      AEROCHORUS_ADSB_PROVIDER: ${AEROCHORUS_ADSB_PROVIDER:-auto}
      # Model adjudication (ADR-022): the API plans and prices batches but never holds
      # the OpenRouter key. The runner (`aerochorus adjudicate run`) on the audio host does.
    ports:
      # Loopback by default. On the host that serves remote workers (e.g. the
      # Linux host serving the 5080 box), set AEROCHORUS_API_BIND to its LAN address.
      # There is no authentication: bind only to a trusted network.
      - "${AEROCHORUS_API_BIND:-127.0.0.1}:${AEROCHORUS_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
