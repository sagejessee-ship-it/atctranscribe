[project]
name = "aerochorus"
version = "0.1.0"
description = "Local ATC corpus transcription, ensemble, and evidence lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "mutagen>=1.47",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.2",
    "uvicorn>=0.32",
    "zstandard>=0.25.0",
]

[project.scripts]
aerochorus = "aerochorus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv.sources]
# Windows dev PC: SQLAlchemy's pure-Python wheel (same release). Smart App Control blocks
# its compiled .pyd files (unsigned, little reputation), which broke every on-host process
# that touches the database: tests, the e2e stack (2026-10-09). Linux and the container
# images keep the compiled wheel.
sqlalchemy = [
    { url = "https://files.pythonhosted.org/packages/c5/7a/7d1879d78c086737acee5f3250cbff9d285e5bd7cb6bc2c730f24e8d400e/sqlalchemy-2.1.1-py3-none-any.whl", marker = "sys_platform == 'win32'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerochorus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/aerochorus/migrations/versions/*.py" = ["E501"]
