# Suites are ordered rosters. full-lab-v1 is populated only from models that
# pass qualification (see docs/runbook.md, "Qualify models").
[suites.smoke]
description = "One small model: validates the pipeline end to end"
models = ["parakeet-tdt-0.6b-v3-q8_0"]

[suites.core-diverse]
description = "Four architecturally different families"
models = [
    "parakeet-tdt-0.6b-v3-q8_0",
    "canary-1b-v2-q8_0",
    "whisper-large-v3-turbo-q8_0",
    "qwen3-asr-0.6b-q8_0",
]

[suites.qualification]
description = "Every catalogued candidate, for the qualification benchmark"
models = [
    "parakeet-tdt-0.6b-v3-q8_0",
    "canary-1b-v2-q8_0",
    "whisper-large-v3-turbo-q8_0",
    "qwen3-asr-0.6b-q8_0",
    "granite-speech-4.1-2b-q4_k",
    "voxtral-mini-3b-2507-q4_k",
]

[suites.canary-variants]
description = "Decoding variants of canary-1b-v2 (evaluate one at a time; same family)"
models = ["canary-1b-v2-q8_0-beam4"]

# --- Linux GTX 1070 host (ADR-021) -------------------------------------------------------
# One CUDA-path and one CPU-path backend prove both runtime paths on real audio.
[suites.smoke-linux1070]
description = "Setup smoke test on linux_pascal_8gb: Whisper (CUDA) + Parakeet"
models = ["whisper-large-v3-turbo-q8_0", "parakeet-tdt-0.6b-v3-q8_0"]

