# AeroChorus model catalog.
#
# `aerochorus models sync` loads this file into the model registry (PostgreSQL
# is authoritative once synced). A synced model's artifact identity (file,
# sha256, backend) is immutable: a different artifact needs a new
# logical_name. Architecture families here are the ONE family registry
# (ADR-009).
#
# Artifacts are pinned to a Hugging Face commit and verified by SHA-256.
# `capabilities` record what each model returned through CrispASR 0.8.37's
# server (verbose_json) on real BWI audio, 2026-09-27: per-word timestamps
# for parakeet/canary/whisper; no model returns token probabilities there.
# Quantization: q8_0 for small models, q4_k for 2B+ models so every model
# fits the GTX 1070's 8 GB with one model resident (ADR-021).
#
# Separate questions (ADR-021):
#   * is it in this catalog?             -> a candidate AeroChorus may run
#   * is it qualified on a profile?      -> `aerochorus models qualifications`
#   * ensemble_eligible                  -> may it VOTE in agreement (research-only if false)
#   * sweep_eligible (`models set`)      -> may full sweeps use it

[families.parakeet]
display_name = "NVIDIA Parakeet (FastConformer + TDT transducer)"
[families.canary]
display_name = "NVIDIA Canary (FastConformer + Transformer decoder)"
[families.whisper]
display_name = "OpenAI Whisper (encoder-decoder transformer)"
[families.qwen3-asr]
display_name = "Qwen3-ASR (audio encoder + Qwen3 LLM)"
[families.granite-speech]
display_name = "IBM Granite Speech (Conformer + Q-Former + Granite LLM)"
[families.voxtral]
display_name = "Mistral Voxtral (Whisper encoder + Mistral LLM)"
[families.canary-qwen]
display_name = "NVIDIA Canary-Qwen (FastConformer encoder + Qwen LLM decoder)"
[families.cohere-transcribe]
display_name = "Cohere Transcribe (conformer encoder-decoder)"
[families.kyutai-stt]
display_name = "Kyutai STT (delayed-streams Mimi codec + transformer)"
[families.glm-asr]
display_name = "GLM-ASR (Whisper-style encoder + GLM LLM)"
[families.fastconformer-ctc]
display_name = "NVIDIA FastConformer CTC (non-autoregressive CTC decoder)"
[families.wav2vec2]
display_name = "wav2vec 2.0 XLS-R (self-supervised encoder + CTC)"
[families.gemma4-audio]
display_name = "Google Gemma 4 E2B (audio-capable LLM)"
[families.omniasr]
display_name = "Meta Omnilingual ASR (wav2vec2-style encoder + CTC)"

