# AeroChorus model catalog.
#
# `aerochorus models sync` loads this file into the model registry (PostgreSQL
# is authoritative once synced). A synced model's artifact identity (file,
# sha256, backend) is immutable: a different artifact needs a new
# logical_name. Architecture families here are the ONE family registry
# (ADR-009).
#
# Artifacts are pinned to a Hugging Face commit and verified by SHA-256.
# `capabilities` record what each model returned through CrispASR 0.8.37's
# server (verbose_json) on real BWI audio, 2026-09-27: per-word timestamps
# for parakeet/canary/whisper; no model returns token probabilities there.
# Quantization: q8_0 for small models, q4_k for 2-3B models so the whole
# roster also fits the 16 GB M1.

[families.parakeet]
display_name = "NVIDIA Parakeet (FastConformer + TDT transducer)"
[families.canary]
display_name = "NVIDIA Canary (FastConformer + Transformer decoder)"
[families.whisper]
display_name = "OpenAI Whisper (encoder-decoder transformer)"
[families.qwen3-asr]
display_name = "Qwen3-ASR (audio encoder + Qwen3 LLM)"
[families.granite-speech]
display_name = "IBM Granite Speech (Conformer + Q-Former + Granite LLM)"
[families.voxtral]
display_name = "Mistral Voxtral (Whisper encoder + Mistral LLM)"

[[models]]
logical_name = "parakeet-tdt-0.6b-v3-q8_0"
architecture_family = "parakeet"
crisp_backend = "parakeet"
upstream_model = "nvidia/parakeet-tdt-0.6b-v3"
artifact_repo = "cstr/parakeet-tdt-0.6b-v3-GGUF"
upstream_revision = "dff69b0e675921ffd5a6133f5fbe2aac690d3ec3"
model_filename = "parakeet-tdt-0.6b-v3-q8_0.gguf"
model_sha256 = "300de963db10e991a8c3c1674000245546f2e99d396f860aecbde2dd0534e43f"
artifact_size_bytes = 674342336
quantization = "q8_0"
language = "en"
request_params = { language = "en" }
capabilities = { word_timestamps = true, token_confidence = false }
pedigree = { license = "CC-BY-4.0" }
experimental = false

[[models]]
logical_name = "canary-1b-v2-q8_0"
architecture_family = "canary"
crisp_backend = "canary"
upstream_model = "nvidia/canary-1b-v2"
artifact_repo = "cstr/canary-1b-v2-GGUF"
upstream_revision = "f4a12db73daa964aa56a188826682f6b11fdc960"
model_filename = "canary-1b-v2-q8_0.gguf"
model_sha256 = "81421a82cdcb23746f6c3e8c2859094f7e8c27dd8ba77d4b8f8440395fbc7c7a"
artifact_size_bytes = 1049050784
quantization = "q8_0"
language = "en"
# The auto-aligner would silently download an extra model; keep runs hermetic.
request_params = { language = "en", source_lang = "en", target_lang = "en", no_auto_aligner = "true" }
capabilities = { word_timestamps = true, token_confidence = false }
pedigree = { license = "CC-BY-4.0" }
experimental = false

# Same artifact as canary-1b-v2-q8_0, decoded with beam search. Greedy Canary
# fell into repetition loops on ~ATCO2 non-native audio (2026-09-27; CrispASR
# 0.8.37 ignores max_tokens/frequency_penalty for this backend). Same family:
# never an independent vote alongside the greedy variant (ADR-009).
[[models]]
logical_name = "canary-1b-v2-q8_0-beam4"
architecture_family = "canary"
crisp_backend = "canary"
upstream_model = "nvidia/canary-1b-v2"
