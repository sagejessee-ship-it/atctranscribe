# AeroChorus worker configuration (machine-local; never committed as worker.toml).
#
# Location: $AEROCHORUS_WORKER_CONFIG, or --config, or
#   Linux:   /etc/aerochorus/worker.toml (deploy/linux) or ~/.config/aerochorus/worker.toml
#   Windows:     %APPDATA%\aerochorus\worker.toml

worker_name = "linux1070-worker"
api_url = "http://127.0.0.1:8000"
# Qualification applies per hardware profile; default = detected (never the hostname).
# hardware_profile = "linux_pascal_8gb"

# Seconds between heartbeats and scheduled scans in `aerochorus worker run`.
heartbeat_interval_seconds = 30
incremental_scan_interval_seconds = 900
full_scan_interval_seconds = 86400

# Concurrent file reads during a scan (I/O bound; keep modest on a NAS).
read_concurrency = 4
observation_batch_size = 500

# `worker run` also processes queued sweeps when [transcription] is present.
process_sweeps = true

# Logical source -> where it is mounted on THIS machine.
[sources.home_atc_archive]
root = "/mnt/aerochorus/atc"
auto_scan = true
# Windows (literal string keeps the backslashes):
# root = '\\192.168.68.84\bwi'

[transcription]
# Verified model artifacts (`aerochorus worker models pull`).
models_dir = "/srv/aerochorus/models"
# Raw CrispASR responses (.json.zst). Must NOT be inside a corpus source.
artifact_root = "/srv/aerochorus/artifacts"
# Logical store name used in artifact:// URIs.
artifact_store = "linux1070"
lease_seconds = 600
pending_batch = 25
auto_pull_models = false

# --- Linux + GTX 1070: pinned CUDA 12 binary (deploy/linux/native/install-crispasr.sh, ADR-021; the Linux host uses containers, ADR-023) ---
[transcription.crispasr]
launcher = "native"
binary = "/srv/aerochorus/crispasr/current/crispasr"
host_port = 8090
env = { LD_LIBRARY_PATH = "/srv/aerochorus/crispasr/current:/srv/aerochorus/cuda12/nvidia/cuda_runtime/lib:/srv/aerochorus/cuda12/nvidia/cublas/lib" }

# Per-model memory/offload (recorded with every run; nothing implicit):
# [transcription.model_runtime."canary-qwen-2.5b-q4_k"]
# strategy = "kv-q8"
# env = { CRISPASR_KV_QUANT = "q8_0" }

# --- Windows + NVIDIA (the 5080 box): the CrispASR CUDA server image instead ---
# [transcription.crispasr]
# launcher = "docker"
# image = "ghcr.io/crispstrobe/crispasr@sha256:<digest>"   # pin; see runbook
# gpus = "all"
# host_port = 8090
