# AeroChorus worker configuration (machine-local; never committed as worker.toml).
#
# Location: $AEROCHORUS_WORKER_CONFIG, or --config, or
#   Linux:   /etc/aerochorus/worker.toml or ~/.config/aerochorus/worker.toml
#   Windows:     %APPDATA%\aerochorus\worker.toml

worker_name = "jesseepc-5080"
api_url = "http://127.0.0.1:8000"
# Qualification applies per hardware profile; default = detected (never the hostname).
# hardware_profile = "windows_blackwell_16gb"

# Seconds between heartbeats and scheduled scans in `aerochorus worker run`.
heartbeat_interval_seconds = 30
incremental_scan_interval_seconds = 900
full_scan_interval_seconds = 86400

# Concurrent file reads during a scan (I/O bound; keep modest on a NAS).
read_concurrency = 4
observation_batch_size = 500

# `worker run` also processes queued sweeps when [transcription] is present.
process_sweeps = true

# Logical source -> where it is mounted on THIS machine.
[sources.home_atc_archive]
root = "/mnt/aerochorus/atc"
auto_scan = true
# Windows (literal string keeps the backslashes):
# root = '\\192.168.68.84\bwi'

[transcription]
# Verified model artifacts (`aerochorus worker models pull`).
models_dir = "/srv/aerochorus/models"
# Raw CrispASR responses (.json.zst). Must NOT be inside a corpus source.
artifact_root = "/srv/aerochorus/artifacts"
# Logical store name used in artifact:// URIs.
artifact_store = "jesseepc"
lease_seconds = 600
pending_batch = 25
auto_pull_models = false
# Two models at once on one GPU (`worker run`): the second starts only when its
# estimated footprint fits in free GPU memory minus the headroom (a game counts too).
# max_concurrent_models = 2
# vram_headroom_mb = 1500

# Per-model memory/offload (recorded with every run; nothing implicit):
# [transcription.model_runtime."canary-qwen-2.5b-q4_k"]
# strategy = "kv-q8"
# env = { CRISPASR_KV_QUANT = "q8_0" }

# Copies of a slow model's server in one model run (more throughput while the GPU has
# spare compute). Each copy holds its own weights; copies after the first start only if
# free GPU memory minus vram_headroom_mb fits one more, on ports host_port + slot + 2,
# + 4, ... Not part of the runtime fingerprint, so a run in progress resumes with them.
# [transcription.model_runtime."gemma4-e2b-it-q4_k"]
# replicas = 2

# --- CrispASR: the CUDA server image, pinned by digest (see the runbook) ---
[transcription.crispasr]
launcher = "docker"
# CrispASR 0.8.39 (CUDA 13, RTX 50xx)
image = "ghcr.io/crispstrobe/crispasr@sha256:7bf5e366e4c79a354901bc9e4cd25a998200f4d4a0a7c4c33520922120811db2"
gpus = "all"
host_port = 8090
